# Configuracao do servidor_nuati para o buscador-normativos (modelo: servidor_nuati/servidor_nuati.conf.example).
# CHAVE=valor; # comenta a linha. Vai para o git (nao tem segredo); os segredos ficam no secrets.toml do servidor.

# Nome da tarefa no Agendador do Windows; tambem nomeia a regra de firewall.
NOME_TAREFA=BuscadorNormativos

# Porta do Streamlit no servidor (registro de portas: segredos.exemplo.toml do framework).
PORTA=8404

# O app fica numa subpasta do repo; o iniciar.cmd faz cd para ca.
PASTA_APP=levantamento-normativos
ARQUIVO_APP=app.py
REQUIREMENTS=requirements.txt

# O buscador nao carrega .env: a configuracao e o .streamlit/secrets.toml dentro de PASTA_APP.
CONFIG=.streamlit/secrets.toml

# D-C22: o servidor espelha a main.
RAMO=main

LOG_MAX_MB=20
